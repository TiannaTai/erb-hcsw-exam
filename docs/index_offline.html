<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>護理題庫（離線版）</title>
  <style>
    :root{--bg:#f8fafc;--card:#fff;--muted:#6b7280;--accent:#2563eb;--success:#16a34a}
    *{box-sizing:border-box}
    body{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;margin:0;background:var(--bg);color:#0f172a}
    .container{max-width:1100px;margin:0 auto;padding:28px}
    header{background:linear-gradient(90deg,#eef2ff 0%,#fff 100%);border-bottom:1px solid #e6eefc;padding:18px 28px}
    h1{margin:0;font-size:1.4rem}
    .lead{margin-top:6px;color:var(--muted)}
    .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}
    .controls label{display:flex;gap:8px;align-items:center}
    select,input{padding:8px 10px;border-radius:8px;border:1px solid #cbd5e1;background:white}
    .buttons{margin-left:auto;display:flex;gap:8px}
    .btn{padding:8px 12px;border-radius:8px;border:1px solid rgba(2,6,23,0.08);background:transparent;cursor:pointer}
    .btn.primary{background:var(--accent);color:white;border:none}
    .summary{background:var(--card);padding:12px;border-radius:10px;border:1px solid #e6eefc;margin-bottom:12px}
    .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
    .card{background:var(--card);padding:12px;border-radius:10px;border:1px solid #e6eefc}
    .meta{font-size:0.85rem;color:var(--muted);margin-bottom:6px}
    .card h3{margin:4px 0 8px;font-size:1rem}
    ul{margin:8px 0;padding-left:18px}
    footer{margin-top:18px;color:var(--muted);font-size:0.9rem}
    .notice{color:#b45309;font-weight:600}
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>護理題庫（離線版）</h1>
      <p class="lead">完全離線可用：1k / 2k / 5k 即時產生、篩選、下載 JSONL / CSV。</p>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <label>資料集：
        <select id="datasetSelect">
          <option value="1000">1,000 題 (預設)</option>
          <option value="2000">2,000 題</option>
          <option value="5000">5,000 題</option>
        </select>
      </label>

      <label>模組：
        <select id="moduleFilter"><option value="all">全部模組</option></select>
      </label>

      <label>難度：
        <select id="difficultyFilter">
          <option value="all">全部</option>
          <option value="easy">easy</option>
          <option value="medium">medium</option>
          <option value="hard">hard</option>
        </select>
      </label>

      <input id="searchBox" placeholder="搜尋題目 / 關鍵字" />

      <div class="buttons">
        <button id="regenBtn" class="btn primary">重新產生</button>
        <button id="downloadJsonl" class="btn">下載 JSONL</button>
        <button id="downloadCsv" class="btn">下載 CSV</button>
      </div>
    </section>

    <section class="summary" id="summary"></section>

    <section id="list" class="list"></section>

    <footer>
      <p>本系統為自動題庫產生器（機器生成）。離線測試版；在正式使用前請交由專業教師審核。</p>
    </footer>
  </main>

  <script>
  (function(){
    const MODULES = {
      "急救與復甦": ["心肺復甦","氣道管理","CPR","急性呼吸衰竭","除顫","緊急應變"],
      "藥物護理": ["給藥安全","藥效觀察","副作用","劑量","注射","口服藥"],
      "感染控制": ["手部衛生","標準預防","隔離","清消","滅菌","暴露處理"],
      "精神護理": ["焦慮","憂鬱","幻覺","情緒穩定","自傷風險","躁動"],
      "基礎護理": ["活動照護","沐浴","轉位","生活照護","安全","衛生"],
      "呼吸照護": ["氧療","吸痰","胸部評估","呼吸窘迫","氣道清除","氧飽和"],
      "母嬰護理": ["新生兒評估","哺乳","產後照護","黃疸","分娩","乳房護理"],
      "疼痛管理": ["疼痛評估","術後疼痛","慢性疼痛","非藥物緩解","鎮痛","疼痛教育"],
      "泌尿護理": ["排尿評估","導尿","失禁","尿路感染","尿量監測","膀胱功能"],
      "檢驗與影像": ["抽血","檢體","禁食","影像準備","檢查安全","檢驗解讀"],
      "內科護理": ["發燒","低血糖","高血糖","胸痛","腹痛","呼吸困難"],
      "骨科護理": ["骨折","固定","神經血管","復健","牽引","疼痛管理"],
      "營養照護": ["營養評估","高蛋白","吞嚥","低鹽","補充飲食","營養教育"],
      "病人安全": ["跌倒預防","壓瘡預防","交接","防護裝備","識別","環境安全"],
      "評估與紀錄": ["生命徵象","病歷","紀錄","病情變化","文書","觀察"]
    };

    function shortHash(s){
      let h=0; for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0} return (h>>>0).toString(16).slice(-8)
    }

    function makeQuestion(i){
      const modules = Object.keys(MODULES);
      const module = modules[(i-1)%modules.length];
      const topics = MODULES[module];
      const topic = topics[(i-1)%topics.length];
      const difficulty = (i%4===0)?'easy':(i%3===0)?'medium':'hard';
      const stem = `病人${topic}時，最重要的護理行動是什麼？`;
      const en = stem.replace(/病人/g,'patient').replace(/護理師/g,'nurse');
      const answer = module==='急救與復甦'? '先評估生命徵象並啟動急救流程' : '確認病人身份與醫囑';
      const choices = [answer, '等待家屬決定', '延後至下一班', '忽略評估'];
      for(let j=choices.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[choices[j],choices[k]]=[choices[k],choices[j]]}
      const choiceObjs = choices.map(c=>({text_cn:c,text_en:c,correct:c===answer}));
      return {
        id:`Q${String(i).padStart(4,'0')}`,
        module,module, type:'mcq', difficulty, difficulty_level: difficulty==='easy'?1: difficulty==='medium'?2:4,
        question_cn:stem, question_en:en, choices:choiceObjs,
        tags:[module,topic], dedupe_key: shortHash(module+topic+stem)
      };
    }

    function generateBank(n){
      const out=[]; const seen=new Set(); let i=101; while(out.length<n){const q=makeQuestion(i); if(!seen.has(q.dedupe_key)){out.push(q); seen.add(q.dedupe_key)} i++}
      return out;
    }

    const datasetSelect=document.getElementById('datasetSelect');
    const moduleFilter=document.getElementById('moduleFilter');
    const difficultyFilter=document.getElementById('difficultyFilter');
    const searchBox=document.getElementById('searchBox');
    const regenBtn=document.getElementById('regenBtn');
    const downloadJsonl=document.getElementById('downloadJsonl');
    const downloadCsv=document.getElementById('downloadCsv');
    const list=document.getElementById('list');
    const summary=document.getElementById('summary');

    let currentBank=[];
    let fallbackNotice='離線示例';

    function populateModuleOptions(bank){
      const mods=[...new Set(bank.map(q=>q.module))];
      moduleFilter.innerHTML='<option value="all">全部模組</option>'+mods.map(m=>`<option value="${m}">${m}</option>`).join('');
    }

    function render(bank){
      summary.innerHTML = `<strong>題數:</strong> ${bank.length} 題 <span class="notice">(${fallbackNotice})</span>`;
      const qtxtFilter = (q)=>{
        const search = (searchBox.value||'').toLowerCase();
        if(search && !(`${q.id} ${q.module} ${q.question_cn} ${q.question_en} ${q.tags.join(' ')}`.toLowerCase().includes(search))) return false;
        if(difficultyFilter.value!=='all' && q.difficulty!==difficultyFilter.value) return false;
        if(moduleFilter.value!=='all' && q.module!==moduleFilter.value) return false;
        return true;
      };
      const filtered = bank.filter(qtxtFilter);
      if(filtered.length===0){
        list.innerHTML = '<div class="card"><p>沒有符合條件的題目。請調整篩選或輸入其他關鍵字。</p></div>';
        return;
      }
      list.innerHTML = filtered.slice(0,200).map(q=>`<div class="card"><div class="meta"><strong>${q.id}</strong> · ${q.module} · ${q.difficulty}</div><h3>${q.question_cn}</h3><p><em>${q.question_en}</em></p><ul>${q.choices.map(c=>`<li>${c.text_cn}${c.correct?'<strong style="color:var(--success)"> (正確)</strong>':''}</li>`).join('')}</ul></div>`).join('');
      if(filtered.length>200) list.innerHTML += `<div class="card" style="grid-column:1/-1"><em>顯示前200題；若要全部匯出請按下載按鈕。</em></div>`;
    }

    function regen(){
      const n = Number(datasetSelect.value||1000);
      currentBank = generateBank(n);
      fallbackNotice = '即時生成';
      populateModuleOptions(currentBank);
      render(currentBank);
    }

    function download(filename, text){
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})); a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    }

    function toJsonl(bank){ return bank.map(r=>JSON.stringify(r, null, 0)).join('\n') + '\n'; }
    function toCsv(bank){
      const rows = [['id','module','difficulty','question_cn','question_en','correct_answer','tags']];
      for(const r of bank){
        const ans = r.choices.find(c=>c.correct).text_cn;
        rows.push([r.id,r.module,r.difficulty,`"${r.question_cn.replace(/"/g,'""')}` ,`"${r.question_en.replace(/"/g,'""')}`,`"${ans.replace(/"/g,'""')}`,`"${r.tags.join(';')}` ]);
      }
      return rows.map(r=>r.join(',')).join('\n');
    }

    regenBtn.addEventListener('click', regen);
    moduleFilter.addEventListener('change', ()=>render(currentBank));
    difficultyFilter.addEventListener('change', ()=>render(currentBank));
    searchBox.addEventListener('input', ()=>render(currentBank));
    datasetSelect.addEventListener('change', regen);
    downloadJsonl.addEventListener('click', ()=>download(`nursing_questions.jsonl`, toJsonl(currentBank)));
    downloadCsv.addEventListener('click', ()=>download(`nursing_questions.csv`, toCsv(currentBank)));

    currentBank = generateBank(Number(datasetSelect.value||1000));
    populateModuleOptions(currentBank);
    render(currentBank);
  })();
  </script>
</body>
</html>
