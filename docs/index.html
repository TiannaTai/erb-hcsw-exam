<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>護理題庫 (Live Generator)</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="top">
    <div class="container">
      <h1>護理題庫 - 最終成像 (Live)</h1>
      <p class="lead">立即在瀏覽器產生 1k / 2k / 5k 題，支援篩選、下載 JSONL / CSV，並以精美頁面預覽。</p>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <label>資料集：
        <select id="datasetSelect">
          <option value="1000">1,000 題 (預設)</option>
          <option value="2000">2,000 題</option>
          <option value="5000">5,000 題</option>
        </select>
      </label>

      <label>模組：
        <select id="moduleFilter"><option value="all">全部模組</option></select>
      </label>

      <label>難度：
        <select id="difficultyFilter">
          <option value="all">全部</option>
          <option value="easy">easy</option>
          <option value="medium">medium</option>
          <option value="hard">hard</option>
        </select>
      </label>

      <input id="searchBox" placeholder="搜尋題目 / 關鍵字" />

      <div class="buttons">
        <button id="regenBtn" class="btn primary">重新產生</button>
        <button id="downloadJsonl" class="btn">下載 JSONL</button>
        <button id="downloadCsv" class="btn">下載 CSV</button>
      </div>
    </section>

    <section class="summary" id="summary"></section>

    <section id="list" class="list"></section>

    <footer class="foot">
      <p>本系統為自動題庫產生器 (bilingual)，內容為機器生成，使用於正式評量前請由專業教師審核。</p>
    </footer>
  </main>

  <script src="./app.js"></script>
</body>
</html>
