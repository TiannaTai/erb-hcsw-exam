let cq=[],ci=0,sc=0,an=0,tq=0,cm="all";
const sh=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};

function toggleLang(){isEn=!isEn;document.getElementById('langBtn').textContent=isEn?'🌐 中文':'🌐 EN';if(!document.getElementById('homeArea').classList.contains('hidden'))showHome();if(!document.getElementById('quizArea').classList.contains('hidden'))renderQ();if(!document.getElementById('hospitalArea').classList.contains('hidden'))showH()}

function showHome(){document.getElementById('homeArea').classList.remove('hidden');document.getElementById('quizArea').classList.add('hidden');document.getElementById('hospitalArea').classList.add('hidden');document.getElementById('resultArea').classList.add('hidden');document.getElementById('homeBtn').classList.add('hidden');document.getElementById('statsBar').classList.add('hidden');document.getElementById('pageTitle').textContent=isEn?"🩺 ERB HCSW Exam":"🩺 ERB 醫護支援考試";
const mods=[{name:"全部題目",name_en:"All Questions",count:Q.length,id:"all"},...Array.from(new Set(Q.map(q=>q.m))).map(m=>({name:m,name_en:Q.find(q=>q.m===m).m_en,count:Q.filter(q=>q.m===m).length,id:m})),{name:"🏥 醫院分佈",name_en:"🏥 Hospital Map",count:"地圖",id:"hospital"}];
let h=`<div class="card"><h2 style="font-size:18px;margin-bottom:12px;">${isEn?"Select Module":"請選擇測驗模塊"}</h2><div class="module-grid">`;
mods.forEach(m=>{h+=`<div class="module-card" onclick="startM('${m.id}')"><h3>${isEn?m.name_en:m.name}</h3><p>${m.count} ${isEn?"items":"項"}</p></div>`});h+=`</div></div>`;document.getElementById('homeArea').innerHTML=h}

function startM(id){if(id==="hospital"){showH();return}cm=id;const p=id==="all"?Q:Q.filter(q=>q.m===id);const mc=sh(p).slice(0,20);cq=mc;tq=cq.length;ci=0;sc=0;an=0;document.getElementById('homeArea').classList.add('hidden');document.getElementById('resultArea').classList.add('hidden');document.getElementById('quizArea').classList.remove('hidden');document.getElementById('hospitalArea').classList.add('hidden');document.getElementById('homeBtn').classList.remove('hidden');document.getElementById('statsBar').classList.remove('hidden');document.getElementById('pageTitle').textContent=isEn?`🩺 ${id==="all"?"All":Q.find(q=>q.m===id).m_en} Exam`:`🩺 ${id==="all"?"全部":id} 測驗`;renderQ()}

function showH(){document.getElementById('homeArea').classList.add('hidden');document.getElementById('quizArea').classList.add('hidden');document.getElementById('resultArea').classList.add('hidden');document.getElementById('hospitalArea').classList.remove('hidden');document.getElementById('homeBtn').classList.remove('hidden');document.getElementById('statsBar').classList.add('hidden');document.getElementById('pageTitle').textContent=isEn?"🏥 Hospital Map":"🏥 醫院分佈";
let h=`<div class="card"><h2 style="font-size:18px;margin-bottom:12px;">${isEn?"Hospital Authority Clusters":"醫院管理局七大聯網"}</h2><div class="hl">`;
H.forEach(n=>{h+=`<div class="hi"><h4>${isEn?n.network_en:n.network.split(" / ")[0]}</h4>`;n.hospitals.forEach(x=>{h+=`<p>📍 ${isEn?x.name_en:x.name} <br><small>${x.location}</small></p>`});h+=`</div>`});
h+=`</div><div class="nav-links"><a href="https://www.ha.org.hk/visitor/ha_visitor_index.asp?Content_ID=10036&Lang=CHIB5" target="_blank">🗺️ 醫管局官方分佈圖</a><a href="https://www.ha.org.hk/visitor/ha_visitor_index.asp?Content_ID=10053&Lang=CHIB5" target="_blank">🏥 專科門診</a><a href="https://www.ha.org.hk/visitor/ha_visitor_index.asp?Content_ID=10052&Lang=CHIB5" target="_blank">🩺 家庭醫學門診</a></div></div>`;
document.getElementById('hospitalArea').innerHTML=h}

function uS(){document.getElementById('progress').textContent=isEn?`Progress: ${an} / ${tq}`:`進度: ${an} / ${tq}`;const a=an>0?Math.round((sc/an)*100):0;document.getElementById('accuracy').textContent=isEn?`Accuracy: ${a}%`:`正確率: ${a}%`}

function renderQ(){if(ci>=cq.length){showRes();return}const q=cq[ci];const ar=document.getElementById('quizArea');
ar.innerHTML=`<div class="card"><div class="q-num">${isEn?`Q ${ci+1} / ${tq}`:`第 ${ci+1} 題 / 共 ${tq} 題`}</div><div class="q-text">${isEn?q.q_en:q.q}</div><div id="opts">${q.o.map((o,i)=>`<button class="option" onclick="sel(${i})">${String.fromCharCode(65+i)}. ${isEn?q.o_en[i]:o}${isEn?`<span class="option-en">${o}</span>`:``}</button>`).join('')}</div><div id="fb" class="feedback"></div><button id="nb" class="btn btn-p hidden" onclick="nx()">${isEn?'Next →':'下一題 →'}</button></div>`;
uS();window.scrollTo({top:0,behavior:'smooth'})}

function sel(s){const q=cq[ci];const os=document.querySelectorAll('.option');const fb=document.getElementById('fb');os.forEach(o=>o.classList.add('disabled'));os[q.a].classList.add('correct');if(s!==q.a)os[s].classList.add('wrong');const ok=s===q.a;if(ok)sc++;an++;fb.className=`feedback show ${ok?'fb-ok':'fb-no'}`;fb.innerHTML=ok?`✅ ${isEn?'Correct!':'正確！'}<br><small>${isEn?q.e_en:q.e}</small>`:`❌ ${isEn?'Wrong. Answer: ':'答錯了。正確答案：'}${String.fromCharCode(65+q.a)}<br><small>${isEn?q.e_en:q.e}</small>`;document.getElementById('nb').classList.remove('hidden');uS()}

function nx(){ci++;renderQ()}

function showRes(){document.getElementById('quizArea').classList.add('hidden');const ar=document.getElementById('resultArea');ar.classList.remove('hidden');const p=tq>0?Math.round((sc/tq)*100):0;const m=p>=80?'🎉 '+(isEn?'Excellent!':'表現優秀！'):p>=60?'👍 '+(isEn?'Good!':'不錯！'):'📚 '+(isEn?'Keep studying.':'建議多複習。');ar.innerHTML=`<div class="card result"><h2>${isEn?'Completed':'測驗完成'}</h2><div class="score">${p}%</div><p>${isEn?`Correct ${sc}/${tq}`:`答對 ${sc}/${tq} 題`}</p><p style="margin-bottom:24px;color:#4a5568;">${m}</p><button class="btn btn-p" onclick="startM('${cm}')">${isEn?'Retake':'重考'}</button><button class="btn btn-b" onclick="showHome()">${isEn?'Home':'返回主頁'}</button></div>`;window.scrollTo({top:0,behavior:'smooth'})}

showHome();
</script>
