// 考試邏輯
const MCQ_COUNT = 20;
const SHORT_COUNT = 5;
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = 0;
let totalQuestions = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initQuiz() {
  const mcqPool = QUESTION_BANK.filter(q => q.t === "m");
  const shortPool = QUESTION_BANK.filter(q => q.t === "s");
  const selectedMcq = shuffle(mcqPool).slice(0, Math.min(MCQ_COUNT, mcqPool.length));
  const selectedShort = shuffle(shortPool).slice(0, Math.min(SHORT_COUNT, shortPool.length));
  currentQuestions = [...selectedMcq, ...selectedShort];
  totalQuestions = currentQuestions.length;
  currentIndex = 0;
  score = 0;
  answered = 0;
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('modeLabel').textContent = `模式: ${MCQ_COUNT}題MCQ + ${SHORT_COUNT}題短問題`;
  renderQuestion();
}

function updateStats() {
  document.getElementById('progress').textContent = `進度: ${answered} / ${totalQuestions}`;
  const acc = answered > 0 ? Math.round((score / answered) * 100) : 0;
  document.getElementById('accuracy').textContent = `正確率: ${acc}%`;
}

function renderQuestion() {
  if (currentIndex >= currentQuestions.length) {
    showResult();
    return;
  }
  const q = currentQuestions[currentIndex];
  const area = document.getElementById('quizArea');
  const typeLabel = q.t === "s" ? '短問題' : '多項選擇題';
  const typeClass = q.t === "s" ? 'short' : 'mcq';

  if (q.t === "s") {
    area.innerHTML = `
      <div class="card">
        <div class="q-num">第 ${currentIndex + 1} 題 / 共 ${totalQuestions} 題 <span class="q-type ${typeClass}">${typeLabel}</span></div>
        <div class="q-text">${q.q}</div>
        <textarea id="shortAnswer" placeholder="請在此輸入你的答案..."></textarea>
        <button id="submitShort" class="btn btn-primary" onclick="checkShortAnswer()">提交答案</button>
        <div id="feedback" class="feedback"></div>
        <button id="nextBtn" class="btn btn-primary hidden" onclick="nextQuestion()">下一題 →</button>
      </div>
    `;
  } else {
    area.innerHTML = `
      <div class="card">
        <div class="q-num">第 ${currentIndex + 1} 題 / 共 ${totalQuestions} 題 <span class="q-type ${typeClass}">${typeLabel}</span></div>
        <div class="q-text">${q.q}</div>
        <div id="options">
          ${q.o.map((opt, i) => `
            <button class="option" data-index="${i}" onclick="selectOption(${i})">
              ${String.fromCharCode(65 + i)}. ${opt}
            </button>
          `).join('')}
        </div>
        <div id="feedback" class="feedback"></div>
        <button id="nextBtn" class="btn btn-primary hidden" onclick="nextQuestion()">下一題 →</button>
      </div>
    `;
  }
  updateStats();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectOption(selected) {
  const q = currentQuestions[currentIndex];
  const options = document.querySelectorAll('.option');
  const feedback = document.getElementById('feedback');
  options.forEach(o => o.classList.add('disabled'));
  options[q.a].classList.add('correct');
  if (selected !== q.a) {
    options[selected].classList.add('wrong');
  }
  const isCorrect = selected === q.a;
  if (isCorrect) score++;
  answered++;
  feedback.className = `feedback show ${isCorrect ? 'correct-fb' : 'wrong-fb'}`;
  feedback.innerHTML = isCorrect
    ? `✅ 正確！<br><small>${q.e}</small>`
    : `❌ 答錯了。正確答案：${String.fromCharCode(65 + q.a)}. ${q.o[q.a]}<br><small>${q.e}</small>`;
  document.getElementById('nextBtn').classList.remove('hidden');
  updateStats();
}

function checkShortAnswer() {
  const q = currentQuestions[currentIndex];
  const userAnswer = document.getElementById('shortAnswer').value.trim();
  const feedback = document.getElementById('feedback');
  let matchedKeywords = q.k.filter(kw => userAnswer.includes(kw));
  let hint = matchedKeywords.length > 0
    ? `你的答案包含了 ${matchedKeywords.length}/${q.k.length} 個關鍵詞。`
    : '你的答案未包含任何關鍵詞。';
  feedback.className = 'feedback show info-fb';
  feedback.innerHTML = `
    <strong>參考答案：</strong><br>
    ${q.e}<br><br>
    <small>${hint} 請自行對照你的答案是否包含以上要點。</small>
  `;
  document.getElementById('submitShort').classList.add('hidden');
  document.getElementById('nextBtn').classList.remove('hidden');
  answered++;
  score++;
  updateStats();
}

function nextQuestion() {
  currentIndex++;
  renderQuestion();
}

function showResult() {
  document.getElementById('quizArea').classList.add('hidden');
  const area = document.getElementById('resultArea');
  area.classList.remove('hidden');
  const pct = Math.round((score / totalQuestions) * 100);
  let msg = pct >= 80 ? '🎉 表現優秀！' : pct >= 60 ? '👍 不錯，繼續努力！' : '📚 建議多複習題庫。';
  area.innerHTML = `
    <div class="card result">
      <h2>測驗完成</h2>
      <div class="score">${pct}%</div>
      <div class="score-label">答對 ${score} / ${totalQuestions} 題（短問題完成即計分，請自行對照參考答案）</div>
      <p style="margin-bottom:24px;color:#4a5568;">${msg}</p>
      <button class="btn btn-primary" onclick="initQuiz()">🔄 再考一次</button>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

initQuiz();
</script>
