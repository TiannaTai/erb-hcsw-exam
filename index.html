// ========== 全局變數 ==========
let currentList = [];
let currentIndex = 0;
let correct = 0;

// ========== 分頁切換 ==========
document.querySelectorAll(".tab").forEach(t=>{
t.onclick=()=>{
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
t.classList.add("active");
let tar = t.dataset.tab;
document.querySelectorAll(".content").forEach(c=>c.classList.remove("show"));
document.getElementById(tar).classList.add("show");
if(tar==="hospital") loadHospital();
}
})

// ========== 載入醫院百科 ==========
function loadHospital(){
let html = "";
HOSPITAL_DB.forEach(h=>{
html += `<div class="hospital-item">
<strong>${h.name} / ${h.en}</strong><br>
所屬聯網：${h.net}｜類型：${h.type}<br>
介紹：${h.intro}
</div>`;
})
document.getElementById("hospitalList").innerHTML = html;
}

// ========== 語言切換 ==========
document.getElementById("langSwitch").onclick=()=>{
isCN=!isCN;
document.getElementById("langSwitch").innerText = isCN?"切換 English":"切換 中文";
if(currentList.length>0) renderQ();
}

// ========== 開始刷題 ==========
document.getElementById("startBtn").onclick=()=>{
let m = document.getElementById("modSelect").value;
if(m==="all") currentList = [...Q_DB];
else currentList = Q_DB.filter(x=>x.mod===m);
currentIndex=0;correct=0;
renderQ();updateProg();
}

// ========== 渲染題目 ==========
function renderQ(){
let d = currentList[currentIndex][isCN?"zh":"en"];
document.getElementById("question").innerText = (currentIndex+1)+". "+d.q;
let optHtml = "";
d.opt.forEach((txt,i)=>{
optHtml += `<div class="opt" data-i="${i}">${txt}</div>`;
})
document.getElementById("options").innerHTML = optHtml;
document.getElementById("explain").style.display="none";
document.getElementById("nextBtn").style.display="none";

// 選項點擊
document.querySelectorAll(".opt").forEach(o=>{
o.onclick=()=>{
document.querySelectorAll(".opt").forEach(x=>x.style.pointerEvents="none");
let idx = parseInt(o.dataset.i);
if(idx===d.ans){
o.classList.add("correct");correct++;
}else{
o.classList.add("wrong");
document.querySelectorAll(".opt")[d.ans].classList.add("correct");
}
document.getElementById("explain").innerText = d.exp;
document.getElementById("explain").style.display="block";
document.getElementById("nextBtn").style.display="inline-block";
updateProg();
}
})
}

// ========== 下一題 ==========
document.getElementById("nextBtn").onclick=()=>{
currentIndex++;
if(currentIndex>=currentList.length){
alert(isCN?"練習完結！":"Practice completed!");
return;
}
renderQ();
}

// ========== 更新進度 ==========
function updateProg(){
let total = currentList.length;
let rate = total===0?0:Math.round(correct/total*100);
document.getElementById("progressBar").innerText = isCN
?`進度：${currentIndex+1}/${total}｜答對：${correct}｜正確率：${rate}%`
:`Progress: ${currentIndex+1}/${total}｜Correct: ${correct}｜Accuracy: ${rate}%`;
}
</script>
