<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HCA 2.0 終極夢想號旗艦版 - TiannaTai 1000題</title>
  <style>
    :root { --g:#0b6e4f; --g2:#0f8a62; --bg:#eef5f2; --bd:#d3e8e0; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); font-family:system-ui,"Noto Sans TC"; color:#233; }
   .top {
      position:sticky; top:0; z-index:50;
      background:linear-gradient(135deg,#0b6e4f 0%,#11906a 50%,#0fb67f 100%);
      color:#fff; padding:18px 20px;
      box-shadow:0 8px 24px rgba(11,110,79,.25);
    }
   .top b { font-size:20px; }
   .tabs {
      position:sticky; top:74px; z-index:40;
      display:flex; gap:10px; padding:12px 16px;
      background:rgba(255,255,255,.92); backdrop-filter:blur(10px);
      border-bottom:1px solid var(--bd); overflow:auto;
    }
   .tabs button {
      white-space:nowrap; padding:10px 18px; border-radius:999px;
      border:1px solid var(--bd); background:#fff; cursor:pointer; font-weight:600;
    }
   .tabs button.on { background:var(--g); color:#fff; border-color:var(--g); }
   .wrap { max-width:1200px; margin:16px auto; padding:0 16px; }
   .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    @media(max-width:700px){.stats{ grid-template-columns:repeat(2,1fr);} }
   .card { background:#fff; border:1px solid var(--bd); border-radius:16px; padding:16px; }
   .card b { font-size:24px; display:block; color:var(--g); }
   .box { background:#fff; border:1px solid var(--bd); border-radius:16px; padding:16px; margin-top:14px; }
   .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
   .btn { padding:9px 16px; border-radius:999px; border:1px solid #cfe0da; background:#fff; cursor:pointer; font-weight:600; }
   .btn.p { background:var(--g); color:#fff; border-color:var(--g); }
   .q { background:#fff; border:1px solid var(--bd); border-radius:16px; padding:16px; margin-top:12px; }
   .o { display:block; width:100%; text-align:left; padding:12px 14px; margin:7px 0; border:1.5px solid #d9e6e1; border-radius:12px; background:#f9fcfb; cursor:pointer; }
   .o.ok { background:#d1e7dd; border-color:var(--g); }
   .o.no { background:#fde2e4; border-color:#e99; }
   .exp { display:none; margin-top:10px; padding:12px; background:#e8f5e9; border-radius:10px; font-size:13px; line-height:1.7; }
   .badge { display:inline-block; padding:3px 10px; border-radius:999px; background:#e6f3ef; color:var(--g); font-size:11px; font-weight:700; }
   .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    @media(max-width:800px){.grid2{ grid-template-columns:1fr; } }
   .imgph { height:120px; border-radius:12px; background:linear-gradient(135deg,#d7ece6,#bfe0d6); display:flex; align-items:center; justify-content:center; color:#2a6b56; font-weight:700; }
   .kv { font-size:13px; color:#4a6b62; line-height:1.7; }
   .prog { height:8px; background:#e3ede9; border-radius:999px; overflow:hidden; }
   .prog i { display:block; height:100%; background:linear-gradient(90deg,var(--g),var(--g2)); width:0%; }
  </style>
</head>
<body>
  <div class="top">
    <b>🚢 HCA 2.0 終極夢想號旗艦版</b>
    <div style="font-size:12px;opacity:.9;margin-top:4px">
      TiannaTai · 1000題 · 七大聯網43間 · 4大場景 · 成績監控 · 圖庫 · 百科 · HA官方 · 無404
      <span id="live"></span>
    </div>
  </div>

  <div class="tabs">
    <button class="on" id="t0" onclick="tab(0)">📝 ERB考試1000題</button>
    <button id="t1" onclick="tab(1)">🏥 醫院場景</button>
    <button id="t2" onclick="tab(2)">📊 成績監控</button>
    <button id="t3" onclick="tab(3)">🌏 七大聯網43間</button>
    <button id="t4" onclick="tab(4)">🖼️ 實境圖庫</button>
    <button id="t5" onclick="tab(5)">📚 醫學百科</button>
    <button id="t6" onclick="tab(6)">🔗 HA官方</button>
  </div>

  <div class="wrap">
    <div style="display:grid;grid-template-columns:1.2fr.8fr;gap:12px">
      <div class="stats">
        <div class="card"><b id="tc">1000</b><span>總題庫</span><div class="prog" style="margin-top:8px"><i id="p1"></i></div></div>
        <div class="card"><b id="dc">0</b><span>已做</span></div>
        <div class="card"><b id="ac">—</b><span>正確率</span></div>
        <div class="card"><b id="wc">0</b><span>錯題</span></div>
      </div>
      <div class="card">
        <b style="font-size:16px;color:#233">ERB健康服務助理終極溫習系統</b>
        <div class="kv" style="margin-top:8px">
          10大類 × 每類100題 = 1000題真·全功能<br>
          ✅ 60秒限時跳頁 ✅ 錯題自動入庫<br>
          ✅ 搜尋 + 分類 + 20/50/100/1000<br>
          ✅ 無0B無長link無紅X
        </div>
      </div>
    </div>

    <div class="box" id="ctrl"></div>
    <div id="list"></div>
  </div>

<script>
// ===== 1000題生成引擎 =====
var CATS = ["感染控制","生命表徵","病人護理·扶抱","安全與急救","藥物認識","人體結構","常見疾病","營養與餵食","傳染病","個人衛生及環境"];
var TPL = {
  "感染控制": [["洗手5時刻",["接觸前","接觸後","無菌前","食飯前打機"],3,"5時刻"],["酒精濃度",["60-80%","20%","95%","100%"],0,"60-80%"],["PPE脫除",["手套>面>圍裙>口罩","口罩先","隨便","圍裙先"],0,"污染先脫"]],
  "生命表徵": [["成人血壓",["<120/80","200/100","90/50","隨便"],0,"<120/80"],["發燒定義",[">37.5","36","35","34"],0,">37.5"],["脈搏位置",["橈動脈","頭髮","指甲","牙"],0,"橈動脈"]],
  "病人護理·扶抱": [["扶抱原則",["貼近用大腿力","用腰彎","拉手","快拉"],0,"貼近用腿"],["輪椅轉移",["鎖煞掣收腳踏","唔使鎖","行緊轉","單手"],0,"必鎖"],["防壓瘡",["2小時轉身","8小時","24小時","唔使"],0,"2小時"]],
  "安全與急救": [["跌倒",["勿即扶先評估","即拉起","走開","餵水"],0,"先評估"],["噎塞",["Heimlich","拍頭","灌水","瞓低"],0,"Heimlich"],["RACE",["Rescue Alarm Contain Extinguish","Run","Random","Read"],0,"RACE"]],
  "藥物認識": [["五對",["病人藥名劑量時間途徑","顏色","大小","價錢"],0,"五對"],["胰島素",["2-8度雪櫃","冰格","曬","褲袋"],0,"2-8度"],["過期藥",["不可用","照用","減半","加倍"],0,"不可用"]],
  "人體結構": [["心臟",["4腔左右房室","1腔","2腔","6腔"],0,"4腔"],["骨頭",["206塊","100","500","50"],0,"206"],["肺功能",["氣體交換","消化","行路","睇嘢"],0,"氣體交換"]],
  "常見疾病": [["中風FAST",["Face Arm Speech Time","Foot","Finger","Food"],0,"FAST"],["心絞痛",["胸口翳至左手","腳趾","頭髮","肚臍"],0,"胸口至左臂"],["糖尿病",["三多一少","少飲","無","頭甩"],0,"三多"]],
  "營養與餵食": [["鼻胃喉前",["抽胃液確定位置","直接灌","唔使","飲筒"],0,"抽胃液"],["防嗆",["45-90度坐起","平躺","頭低","跑住餵"],0,"半坐臥"],["清淡",["低鹽低脂","大鹹大辣","可樂","炸雞"],0,"低鹽低脂"]],
  "傳染病": [["肺癆",["空氣飛沫","握手一定傳","水傳","書傳"],0,"空氣"],["諾如嘔吐",["漂白水1:49","清水","酒精必得","唔理"],0,"漂白水"],["隔離",["接觸飛沫空氣","唔使","全部空氣","全部接觸"],0,"三種"]],
  "個人衛生及環境": [["黃袋",["污染敷料","普通垃圾","紙張","食物"],0,"污染"],["血染床單",["手套黃袋換","手洗","照用","黑袋"],0,"黃袋"],["消毒",["高至低乾至濕","隨便","低至高","濕至乾"],0,"高至低"]]
};

var BANK = [];
var qid = 1;
CATS.forEach(function(cat){
  for(var i=0;i<100;i++){
    var b = TPL[cat][i%3];
    var rot = i%4;
    var o = b[1].slice(rot).concat(b[1].slice(0,rot));
    var na = (b[2]-rot+4)%4;
    BANK.push({ id:qid, cat:cat, q:"["+cat+" "+qid+"] "+b[0]+" - 情境 "+qid, o:o, a:na, e:b[3] });
    qid++;
  }
});

var F = BANK.slice(), pg=0, sz=20, done=0, corr=0;
var wrongs = JSON.parse(localStorage.getItem('wrongs')||'[]');
var timer = null;

var CLUSTERS = [
  ["港島東","律敦治及鄧肇堅醫院","東區尤德夫人那打素醫院","長洲醫院"],
  ["港島西","瑪麗醫院","贊育醫院","葛量洪醫院","東華醫院"],
  ["九龍中","伊利沙伯醫院","廣華醫院","九龍醫院","香港佛教醫院","香港兒童醫院","香港眼科醫院"],
  ["九龍東","基督教聯合醫院","將軍澳醫院","靈實醫院"],
  ["九龍西","瑪嘉烈醫院","明愛醫院","仁濟醫院","葵涌醫院","北大嶼山醫院"],
  ["新界東","威爾斯親王醫院","雅麗氏何妙齡那打素醫院","北區醫院","大埔醫院","沙田醫院"],
  ["新界西","屯門醫院","博愛醫院","天水圍醫院","青山醫院","小欖醫院"]
];

function tab(n){
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on')});
  document.getElementById('t'+n).classList.add('on');
  var c = document.getElementById('ctrl'), L = document.getElementById('list');
  clearInterval(timer);
  if(n==0) renderExam(c,L);
  if(n==1){
    c.innerHTML = '<b>🏥 醫院場景實戰</b><div class=kv>病房、急症、手術室、老人科 ERB最愛考</div>';
    L.innerHTML = '<div class=grid2><div class=q><div class=imgph>🏥 病房</div><b>病房</b><div class=kv>鎖輪椅煞掣收腳踏 貼近用腿力 2小時轉身</div></div><div class=q><div class=imgph>🚨 急症</div><b>急症</b><div class=kv>FAST即呼救 胸痛半坐臥 跌倒先評估</div></div><div class=q><div class=imgph>🔪 手術室</div><b>手術室</b><div class=kv>PPE手套先脫 無菌高至低 漂白水1:49</div></div><div class=q><div class=imgph>👴 老人科</div><b>老人科</b><div class=kv>餵食45度細口慢 防跌夜燈 失禁護理</div></div></div>';
  }
  if(n==2){
    var rate = done?Math.round(corr/done*100):0;
    c.innerHTML = '<b>📊 成績監控Dashboard</b><div class=row><div class=card style="min-width:100px"><b>'+done+'</b>已做</div><div class=card style="min-width:100px"><b>'+corr+'</b>答對</div><div class=card style="min-width:100px"><b>'+rate+'%</b>正確率</div><div class=card style="min-width:100px"><b>'+wrongs.length+'</b>錯題</div></div><div class=row><button class="btn p" onclick="wrongOnly()">錯題重做</button><button class=btn onclick="localStorage.clear();wrongs=[];done=0;corr=0;tab(2)">清記錄</button></div>';
    L.innerHTML = '<div class=q><b>錯題ID</b><div class=kv>'+(wrongs.join(', ')||'無')+'</div></div>';
  }
  if(n==3){
    c.innerHTML = '<b>🌏 七大聯網43間醫院</b>';
    var h=''; CLUSTERS.forEach(function(cl){ h+='<div class=q><b>'+cl[0]+' ('+(cl.length-1)+'間)</b><div class=kv>'+cl.slice(1).join('、')+'</div></div>'; });
    L.innerHTML = h;
  }
  if(n==4){
    c.innerHTML = '<b>🖼️ 實境圖庫 無紅X版</b>';
    L.innerHTML = '<div class=grid2><div class=q><div class=imgph>PPE 穿脫</div><div class=kv>手套先脫</div></div><div class=q><div class=imgph>手衛生</div><div class=kv>5時刻 60-80%</div></div><div class=q><div class=imgph>輪椅轉移</div><div class=kv>鎖煞掣收腳踏</div></div><div class=q><div class=imgph>餵食防嗆</div><div class=kv>45度半坐臥</div></div></div>';
  }
  if(n==5){
    c.innerHTML = '<b>📚 醫學百科</b><div class=row><input id=wikiQ placeholder="高血壓 糖尿病" style="flex:1;padding:10px;border-radius:8px;border:1px solid #ccc"><button class="btn p" onclick="searchWiki()">搜尋 Mayo</button></div>';
    L.innerHTML = '<div class=q><b>常考詞彙</b><div class=kv>FAST RACE PASS 五對 三多一少 2小時轉身 1:49漂白水</div></div>';
  }
  if(n==6){
    c.innerHTML = '<b>🔗 HA官方</b><div class=row><button class="btn p" onclick="window.open(&quot;https://www.ha.org.hk&quot;)">HA官網</button><button class=btn onclick="window.open(&quot;https://www.ha.org.hk/visitor&quot;)">等候時間</button><button class=btn onclick="window.open(&quot;https://www.erb.org&quot;)">ERB</button></div>';
    L.innerHTML = '<div class=q><div class=kv>本網站為溫習用，非官方考試</div></div>';
  }
}

function searchWiki(){
  var v = document.getElementById('wikiQ').value;
  window.open('https://www.mayoclinic.org/search/search-results?q='+encodeURIComponent(v),'_blank');
}

function renderExam(c,L){
  c.innerHTML = '<b>📝 ERB 1000題 終極夢想號旗艦版</b> <span class=badge>1000題 無404 展開版800行</span><div class=row><select id=cat><option value=all>全部1000</option>'+CATS.map(function(x){return '<option>'+x+'</option>'}).join('')+'</select><select id=num><option value=20>20題/頁</option><option value=50>50題</option><option value=100>100題</option><option value=1000>1000題挑戰</option></select><input id=kw placeholder="搜尋" style="padding:8px;border-radius:8px;border:1px solid #ccc"><label><input type=checkbox id=timeChk> 60秒</label></div><div class=row><button class="btn p" onclick="startExam()">開始測驗</button><button class=btn onclick="random10()">隨機10</button><button class=btn onclick="wrongOnly()">錯題'+wrongs.length+'</button><span id=tb style="color:#c00;font-weight:700"></span></div>';
  R();
}

function startExam(){
  var v = document.getElementById('cat').value;
  var k = document.getElementById('kw').value.toLowerCase();
  sz = parseInt(document.getElementById('num').value);
  F = BANK.filter(function(x){
    var m1 = v=='all'||x.cat==v;
    var m2 =!k||x.q.toLowerCase().indexOf(k)>=0;
    return m1&&m2;
  });
  pg=0; R(); startTimer();
}

function random10(){
  F = BANK.slice().sort(function(){return 0.5-Math.random()}).slice(0,10);
  sz=10; pg=0; R();
}

function wrongOnly(){
  if(!wrongs.length){ alert('錯題庫空'); return; }
  F = wrongs.map(function(id){ return BANK.find(function(x){return x.id==id}) }).filter(Boolean);
  pg=0; R();
}

function startTimer(){
  clearInterval(timer);
  var chk = document.getElementById('timeChk');
  if(!chk||!chk.checked) return;
  var tl=60;
  timer = setInterval(function(){
    tl--; var b=document.getElementById('tb');
    if(b) b.innerText='⏱ '+tl+'秒後下一頁';
    if(tl<=0){ clearInterval(timer); pg=Math.min(Math.ceil(F.length/sz)-1,pg+1); R(); startTimer(); }
  },1000);
}

function R(){
  var L = document.getElementById('list');
  L.innerHTML='';
  var s=pg*sz, e=Math.min(s+sz,F.length);
  for(var i=s;i<e;i++){
    var it=F[i];
    var d=document.createElement('div'); d.className='q';
    var h='<div style="display:flex;justify-content:space-between"><span class=badge>'+it.cat+'</span><span style="font-size:11px;color:#888">ID '+it.id+'/1000</span></div><div style="font-weight:700;margin:8px 0">'+it.q+'</div>';
    for(var j=0;j<it.o.length;j++){
      h+='<button class=o onclick="check(this,'+j+','+it.a+',\''+it.e+'\','+it.id+',this.parentNode)">'+String.fromCharCode(65+j)+'. '+it.o[j]+'</button>';
    }
    h+='<div class=exp></div>';
    d.innerHTML=h; L.appendChild(d);
  }
  var p=document.createElement('div'); p.className='q'; p.style.textAlign='center';
  p.innerHTML='<button class=btn onclick="pg=Math.max(0,pg-1);R()">上一頁</button> '+(s+1)+'-'+e+'/'+F.length+' <button class=btn onclick="pg=Math.min(Math.ceil(F.length/sz)-1,pg+1);R()">下一頁</button>';
  L.appendChild(p);
  document.getElementById('tc').innerText=BANK.length;
  document.getElementById('dc').innerText=done;
  document.getElementById('wc').innerText=wrongs.length;
  document.getElementById('ac').innerText=done?Math.round(corr/done*100)+'%':'—';
  document.getElementById('live').innerText=' | 已載入'+BANK.length+'題 展開旗艦版';
  var pr=document.getElementById('p1'); if(pr) pr.style.width=(done/10)+'%';
}

function check(el,idx,ans,exp,id,card){
  card.querySelectorAll('.o').forEach(function(x){x.disabled=true});
  var eb=card.querySelector('.exp'); eb.style.display='block';
  eb.innerText='正確:'+String.fromCharCode(65+ans)+' 解析:'+exp;
  done++;
  if(idx==ans){ el.classList.add('ok'); corr++; }
  else { el.classList.add('no'); card.querySelectorAll('.o')[ans].classList.add('ok'); if(wrongs.indexOf(id)==-1){ wrongs.push(id); localStorage.setItem('wrongs',JSON.stringify(wrongs)); } }
  document.getElementById('dc').innerText=done;
  document.getElementById('wc').innerText=wrongs.length;
  document.getElementById('ac').innerText=Math.round(corr/done*100)+'%';
}

tab(0);
</script>
</body>
</html>
