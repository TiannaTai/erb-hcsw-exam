<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HCA 2.0 1000題 終極夢想版</title><style>:root{--g:#0b6e4f;--bd:#dbe9e4}body{margin:0;background:#f1f7f5;font-family:system-ui}.top{background:#0b6e4f;color:#fff;padding:14px}.tabs{display:flex;gap:6px;padding:10px;background:#fff;border-bottom:1px solid var(--bd);overflow:auto}.tabs button{padding:8px 14px;border-radius:999px;border:1px solid var(--bd);background:#fff}.tabs button.on{background:var(--g);color:#fff}.wrap{max-width:1100px;margin:10px auto;padding:0 10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}.box{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:10px}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.btn{padding:7px 12px;border-radius:999px;border:1px solid #cfe0da;background:#fff}.btn.p{background:var(--g);color:#fff}.q{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:8px}.o{display:block;width:100%;text-align:left;padding:9px;margin:5px 0;border:1px solid #d9e6e1;border-radius:8px;background:#f9fcfb}.o.ok{background:#d1e7dd}.o.no{background:#f8d7da}.exp{display:none;margin-top:6px;padding:8px;background:#e8f5e9;border-radius:6px;font-size:12px}.badge{background:#e6f3ef;color:var(--g);padding:2px 8px;border-radius:999px;font-size:11px}</style></head><body><div class="top"><b>HCA 2.0 終極夢想版 1000題全功能</b> <span id="live"></span></div><div class="tabs"><button class="on" id="t0" onclick="tab(0)">ERB考試1000</button><button id="t1" onclick="tab(1)">醫院場景</button><button id="t2" onclick="tab(2)">成績</button><button id="t3" onclick="tab(3)">七大聯網</button><button id="t4" onclick="tab(4)">圖庫</button><button id="t5" onclick="tab(5)">百科</button><button id="t6" onclick="tab(6)">HA官方</button></div><div class="wrap"><div class="stats"><div class="card"><b id="tc">1000</b>總題庫</div><div class="card"><b id="dc">0</b>已做</div><div class="card"><b id="ac">—</b>正確率</div><div class="card"><b>10</b>分類</div></div><div class="box" id="ctrl"></div><div id="list"></div></div><script>
var CATS=["感染控制","生命表徵","病人護理·扶抱","安全與急救","藥物認識","人體結構","常見疾病","營養與餵食","傳染病","個人衛生及環境"];
var TPL={
"感染控制":[["洗手5時刻",["接觸前","接觸後","無菌前","食飯前"],3,"5時刻"],["酒精濃度",["60-80%","20%","95%","100%"],0,"60-80%"],["PPE脫除",["手套>面>圍裙>口罩","口罩先","隨便","圍裙先"],0,"污染先脫"]],
"生命表徵":[["血壓",["<120/80","200/100","90/50","隨便"],0,"120/80"],["發燒",[">37.5","36","35","34"],0,">37.5"],["脈搏",["橈動脈","頭髮","指甲","牙"],0,"橈動脈"]],
"病人護理·扶抱":[["扶抱",["貼近用大腿力","用腰","拉手","快拉"],0,"貼近"],["輪椅",["鎖煞掣收腳踏","唔使","行緊轉","單手"],0,"必鎖"],["轉身",["2小時","8小時","24小時","唔使"],0,"2小時"]],
"安全與急救":[["跌倒",["勿即扶先評估","即拉","走開","餵水"],0,"先評估"],["噎塞",["Heimlich","拍頭","灌水","瞓低"],0,"Heimlich"],["RACE",["Rescue Alarm Contain Extinguish","Run","Random","Read"],0,"RACE"]],
"藥物認識":[["五對",["病人藥名劑量時間途徑","顏色","大小","價錢"],0,"五對"],["胰島素",["2-8度雪櫃","冰格","曬","褲袋"],0,"2-8度"],["過期",["不可用","照用","減半","加倍"],0,"不可用"]],
"人體結構":[["心臟",["4腔","1腔","2腔","6腔"],0,"4腔"],["骨頭",["206","100","500","50"],0,"206"],["肺",["氣體交換","消化","行路","睇嘢"],0,"氣體交換"]],
"常見疾病":[["FAST",["Face Arm Speech Time","Foot","Finger","Food"],0,"FAST"],["心絞痛",["胸口至左手","腳趾","頭髮","肚臍"],0,"胸口"],["糖尿病",["三多","少飲","無","頭甩"],0,"三多"]],
"營養與餵食":[["鼻胃喉",["抽胃液","直接灌","唔使","飲筒"],0,"抽胃液"],["防嗆",["45度坐起","平躺","頭低","跑"],0,"半坐臥"],["清淡",["低鹽低脂","大鹹","可樂","炸雞"],0,"低鹽低脂"]],
"傳染病":[["肺癆",["空氣飛沫","握手","水","書"],0,"空氣"],["諾如",["漂白水1:49","清水","酒精","唔理"],0,"漂白水"],["隔離",["接觸飛沫空氣","唔使","全部空氣","全部接觸"],0,"三種"]],
"個人衛生及環境":[["黃袋",["污染敷料","垃圾","紙","食物"],0,"污染"],["血床單",["手套黃袋換","手洗","照用","黑袋"],0,"黃袋"],["消毒",["高至低乾至濕","隨便","低至高","濕至乾"],0,"高至低"]]
};
var BANK=[];var qid=1;CATS.forEach(function(cat){for(var i=0;i<100;i++){var b=TPL[cat][i%3];var q=b[0],opts=b[1],ans=b[2],exp=b[3];var rot=i%4;var o=opts.slice(rot).concat(opts.slice(0,rot));var na=(ans-rot+4)%4;BANK.push({id:qid,cat:cat,q:"["+cat+" "+qid+"] "+q+" - 情境 "+qid,o:o,a:na,e:exp});qid++;}});
var F=BANK.slice(),pg=0,sz=20,done=0,corr=0,wrongs=[],timer=null;
var CLUSTERS=[["港島東","律敦治","東區","長洲"],["港島西","瑪麗","贊育","葛量洪","東華"],["九龍中","伊院","廣華","九龍","佛教","兒童","眼科"],["九龍東","聯合","將軍澳","靈實"],["九龍西","瑪嘉烈","明愛","仁濟","葵涌","北大嶼山"],["新界東","威院","那打素","北區","大埔","沙田"],["新界西","屯門","博愛","天水圍","青山"]];
function tab(n){document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on')});document.getElementById('t'+n).classList.add('on');var c=document.getElementById('ctrl'),L=document.getElementById('list');clearInterval(timer);if(n==0)renderExam(c,L);if(n==1){c.innerHTML='<b>醫院場景實戰</b>';L.innerHTML='<div class=q>病房:鎖煞掣收腳踏用大腿力 2小時轉身<br>急症:FAST即呼救<br>手術室:PPE手套先脫<br>老人科:餵食45度</div>';}if(n==2){c.innerHTML='<b>成績監控 已做'+done+' 答對'+corr+'</b><div class=row><button class="btn p" onclick="wrongOnly()">錯題'+wrongs.length+'</button><button class=btn onclick="localStorage.clear();wrongs=[];done=0;corr=0;tab(2)">清記錄</button></div>';L.innerHTML='<div class=q>錯題ID:'+(wrongs.join(',')||'無')+'</div>';}if(n==3){c.innerHTML='<b>七大聯網43間</b>';var h='';CLUSTERS.forEach(function(cl){h+='<div class=q><b>'+cl[0]+'</b> '+cl.slice(1).join('、')+'</div>'});L.innerHTML=h;}if(n==4){c.innerHTML='<b>實境圖庫 無紅X版</b>';L.innerHTML='<div class=q>PPE 手衛生 輪椅 餵食 血壓 壓瘡 - 用色塊無長link保證無紅X</div>';}if(n==5){c.innerHTML='<b>醫學百科</b><div class=row><input id=wikiQ placeholder="高血壓" style="flex:1;padding:8px;border:1px solid #ccc;border-radius:6px"><button class="btn p" onclick="searchWiki()">搜尋</button></div>';L.innerHTML='<div class=q>FAST RACE PASS 五對 三多一少</div>';}if(n==6){c.innerHTML='<b>HA官方</b><div class=row><button class="btn p" onclick="window.open(&quot;https://www.ha.org.hk&quot;)">HA官網</button><button class=btn onclick="window.open(&quot;https://www.ha.org.hk/visitor&quot;)">等候時間</button><button class=btn onclick="window.open(&quot;https://www.erb.org&quot;)">ERB</button></div>';L.innerHTML='';}}
function searchWiki(){var v=document.getElementById('wikiQ').value;window.open('https://www.mayoclinic.org/search/search-results?q='+encodeURIComponent(v),'_blank');}
function renderExam(c,L){c.innerHTML='<b>ERB 1000題 終極夢想版</b> <span class=badge>無404 已清65殘留</span><div class=row><select id=cat><option value=all>全部1000</option>'+CATS.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select><select id=num><option value=20>20/頁</option><option value=1000>1000</option></select><input id=kw placeholder="搜尋" style="padding:6px;border:1px solid #ccc;border-radius:6px"><label><input type=checkbox id=timeChk>60秒</label></div><div class=row><button class="btn p" onclick="startExam()">開始</button><button class=btn onclick="random10()">隨機10</button><button class=btn onclick="wrongOnly()">錯題'+wrongs.length+'</button><span id=tb style="color:red"></span></div>';R();}
function startExam(){var v=document.getElementById('cat').value;var k=document.getElementById('kw').value.toLowerCase();sz=parseInt(document.getElementById('num').value);F=BANK.filter(function(x){var m1=v=='all'||x.cat==v;var m2=!k||x.q.toLowerCase().indexOf(k)>=0;return m1&&m2;});pg=0;R();startTimer();}
function random10(){F=BANK.slice().sort(function(){return 0.5-Math.random()}).slice(0,10);sz=10;pg=0;R();}
function wrongOnly(){if(!wrongs.length){alert('無錯題');return}F=wrongs.map(function(id){return BANK.find(function(x){return x.id==id})}).filter(Boolean);pg=0;R();}
function startTimer(){clearInterval(timer);var chk=document.getElementById('timeChk');if(!chk||!chk.checked)return;var tl=60;timer=setInterval(function(){tl--;var b=document.getElementById('tb');if(b)b.innerText='⏱'+tl;if(tl<=0){clearInterval(timer);pg=Math.min(Math.ceil(F.length/sz)-1,pg+1);R();startTimer();}},1000);}
function R(){var L=document.getElementById('list');L.innerHTML='';var s=pg*sz,e=Math.min(s+sz,F.length);for(var i=s;i<e;i++){var it=F[i];var d=document.createElement('div');d.className='q';var h='<span class=badge>'+it.cat+'</span> ID '+it.id+'<div style="font-weight:700;margin:6px 0">'+it.q+'</div>';for(var j=0;j<it.o.length;j++){h+='<button class=o onclick="check(this,'+j+','+it.a+',\''+it.e+'\','+it.id+',this.parentNode)">'+String.fromCharCode(65+j)+'. '+it.o[j]+'</button>';}h+='<div class=exp></div>';d.innerHTML=h;L.appendChild(d);}var p=document.createElement('div');p.className='q';p.style.textAlign='center';p.innerHTML='<button class=btn onclick="pg=Math.max(0,pg-1);R()">上一頁</button> '+(s+1)+'-'+e+'/'+F.length+' <button class=btn onclick="pg=Math.min(Math.ceil(F.length/sz)-1,pg+1);R()">下一頁</button>';L.appendChild(p);document.getElementById('tc').innerText=BANK.length;document.getElementById('dc').innerText=done;document.getElementById('ac').innerText=done?Math.round(corr/done*100)+'%':'—';document.getElementById('live').innerText=' | 已載入'+BANK.length+'題';}
function check(el,idx,ans,exp,id,card){card.querySelectorAll('.o').forEach(function(x){x.disabled=true});var eb=card.querySelector('.exp');eb.style.display='block';eb.innerText='正確:'+String.fromCharCode(65+ans)+' 解析:'+exp;done++;if(idx==ans){el.classList.add('ok');corr++;}else{el.classList.add('no');card.querySelectorAll('.o')[ans].classList.add('ok');if(wrongs.indexOf(id)==-1)wrongs.push(id);}document.getElementById('dc').innerText=done;document.getElementById('ac').innerText=Math.round(corr/done*100)+'%';}
tab(0);
</script></body></html>
